name: Verify and package Installer 2

on:
  push:
    paths: ['installer2/**', '.github/workflows/installer2.yml']
  pull_request:
    paths: ['installer2/**', '.github/workflows/installer2.yml']
  workflow_dispatch:
    inputs:
      publish_draft:
        description: 'Create a draft prerelease after all three native builds pass'
        type: boolean
        default: false
      tag:
        description: 'New candidate tag (required only when publishing a draft)'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: installer2-windows-amd64
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            artifact: installer2-linux-amd64
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            artifact: installer2-macos-arm64
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: installer2
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: installer2/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: installer2 -> target
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev patchelf libfuse2
      - run: npm ci
      - run: npm run build
      - run: npm run test:ui
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build native packages
        run: npm run tauri build -- --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: |
            installer2/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            installer2/target/${{ matrix.target }}/release/bundle/deb/*.deb
            installer2/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            installer2/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

  draft-release:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_draft
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: candidate-assets
          merge-multiple: true
      - name: Create candidate draft
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          [[ "$CANDIDATE_TAG" =~ ^installer2-v[0-9][A-Za-z0-9._-]*$ ]] || { echo 'Use a new installer2-v... candidate tag'; exit 1; }
          gh release create "$CANDIDATE_TAG" candidate-assets/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Installer 2 candidate $CANDIDATE_TAG" --draft --prerelease \
            --notes 'Native packages for acceptance testing. See installer2/docs/MIGRATION.md. Unsigned; not a replacement for the Go release until native acceptance is recorded.'
