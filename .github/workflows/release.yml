name: Build and publish release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish"
        required: true
        default: "v4.5"

permissions:
  contents: write

jobs:
  release-tag:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.tag.outputs.value }}
    steps:
      - id: tag
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: release-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            goos: windows
            goarch: amd64
            output: ZombieBuddyInstaller-windows-amd64.exe
            setup: ""
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            output: ZombieBuddyInstaller-linux-amd64
            setup: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev libxkbcommon-dev
          - os: macos-13
            goos: darwin
            goarch: amd64
            output: ZombieBuddyInstaller-macos-amd64
            setup: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-tag.outputs.value }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
          cache-dependency-path: installer/go.sum

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: ${{ matrix.setup }}

      - name: Build installer
        working-directory: installer
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
        run: go build -trimpath -ldflags "-s -w" -o "${{ matrix.output }}" .

      - name: Run tests
        if: runner.os == 'Windows'
        working-directory: installer
        run: go test ./...

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: installer/${{ matrix.output }}
          if-no-files-found: error

  publish:
    needs:
      - release-tag
      - build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-tag.outputs.value }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "ZombieBuddy Installer ${RELEASE_TAG#v}" \
            --latest \
            --notes "## Experimental release

This release includes cross-platform installer support. Linux and macOS support is experimental and may not work on every distribution or system.

Please report platform-specific issues with your operating system and distribution details."
