name: Build Rust application release candidate

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing Rust application version tag to build as a draft'
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-tag:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.tag.outputs.value }}
    steps:
      - id: tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]] || { echo 'Expected a v<version> tag'; exit 1; }
          echo "value=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  verify-and-build:
    needs: release-tag
    uses: ./.github/workflows/installer2.yml
    with:
      ref: ${{ needs.release-tag.outputs.value }}

  draft:
    needs: [release-tag, verify-and-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-tag.outputs.value }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Match tag to application version
        env:
          RELEASE_TAG: ${{ needs.release-tag.outputs.value }}
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const config = JSON.parse(fs.readFileSync("installer2/src-tauri/tauri.conf.json", "utf8"));
            const tag = process.env.RELEASE_TAG;
            const base = `v${config.version}`;
            if (tag !== base && !tag.startsWith(`${base}-`)) throw new Error(`Tag ${tag} does not match application ${config.version}`);
          '
      - uses: actions/download-artifact@v5
        with:
          name: installer2-windows-amd64
          path: release-assets
      - uses: actions/download-artifact@v5
        with:
          name: installer2-linux-amd64
          path: release-assets
      - uses: actions/download-artifact@v5
        with:
          name: installer2-macos-arm64
          path: release-assets
      - name: Validate application formats and create SHA-256 list
        run: node installer2/scripts/package-candidate.mjs release-assets
      - name: Create Rust application draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-tag.outputs.value }}
          RELEASE_NOTES: |
            Rust/Tauri application candidate. Go is not required to build or run it.

            Download and run the application directly; no setup installer.
            Windows: EXE (WebView2 required).
            Linux: executable (chmod +x; WebKitGTK 4.1 required).
            macOS: unzip and open the APP.

            Linux/macOS support is experimental. Applications are unsigned;
            Windows SmartScreen/macOS Gatekeeper warnings may appear.
            SHA256SUMS contains SHA-256 hashes of the three application files.
            Real Steam/game and manual platform acceptance are tracked in installer2/docs/MIGRATION.md.
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "ZombieBuddy Installer ${RELEASE_TAG#v}" \
            --draft --prerelease --notes "$RELEASE_NOTES"
