name: Build Rust application release candidate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing Rust application version tag to build as a draft'
        required: true
        type: string
      notes:
        description: 'Release notes describing the changes in this version'
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-tag:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.tag.outputs.value }}
    steps:
      - id: tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]] || { echo 'Expected a v<version> tag'; exit 1; }
          [[ "$RELEASE_NOTES" =~ [^[:space:]] ]] || { echo 'Release notes are required'; exit 1; }
          echo "value=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  verify-and-build:
    needs: release-tag
    # The reusable workflow also defines its opt-in draft job. GitHub validates
    # its maximum permissions even when that job is skipped for workflow_call.
    permissions:
      contents: write
    uses: ./.github/workflows/installer2.yml
    with:
      ref: ${{ needs.release-tag.outputs.value }}

  draft:
    needs: [release-tag, verify-and-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-tag.outputs.value }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Match tag to application version
        env:
          RELEASE_TAG: ${{ needs.release-tag.outputs.value }}
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const config = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8"));
            const tag = process.env.RELEASE_TAG;
            const base = `v${config.version}`;
            if (tag !== base && !tag.startsWith(`${base}-`)) throw new Error(`Tag ${tag} does not match application ${config.version}`);
          '
      - uses: actions/download-artifact@v5
        with:
          name: installer2-windows-amd64
          path: release-assets
      - uses: actions/download-artifact@v5
        with:
          name: installer2-linux-amd64
          path: release-assets
      - uses: actions/download-artifact@v5
        with:
          name: installer2-macos-arm64
          path: release-assets
      - name: Validate application formats and create SHA-256 list
        run: node scripts/package-candidate.mjs release-assets
      - name: Create Rust application draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-tag.outputs.value }}
          RELEASE_NOTES: ${{ inputs.notes }}
        shell: bash
        run: |
          printf '%s\n' "$RELEASE_NOTES" > release-notes.md
          gh release create "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --target "$(git rev-parse HEAD)" \
            --title "ZombieBuddy Installer ${RELEASE_TAG#v}" \
            --draft --prerelease --notes-file release-notes.md
